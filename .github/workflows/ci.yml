name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }}, ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        adapter: [phasync, revolt]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zlib
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/pest --exclude-group=live,bug
        env:
          HARNESS_ADAPTER: ${{ matrix.adapter }}
